<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>축제 주문 / Festival Order</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="축제주문">
<link rel="apple-touch-icon" href="icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fffaf3;--card:#fff;--tx:#2b2118;--mu:#8a7a6a;--ac:#e8590c;--ok:#2f9e44;--bd:#eadfce;--toss:#3182f6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1713;--card:#272019;--tx:#f5ece0;--mu:#a89884;--bd:#3a3026}}
:root[data-theme="dark"]{--bg:#1c1713;--card:#272019;--tx:#f5ece0;--mu:#a89884;--bd:#3a3026}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
input, button{-webkit-user-select:text;user-select:text}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
input{width:100%;padding:12px;font-size:18px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 14px;background:var(--ac);color:#fff;font-weight:600}
button.g{background:var(--bd);color:var(--tx)}button.ok{background:var(--ok)}button.toss{background:var(--toss);color:#fff}button:disabled{opacity:.4}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.q{display:flex;align-items:center;gap:10px}.q button{width:38px;padding:8px}.q b{min-width:20px;text-align:center}
.mu{color:var(--mu);font-size:14px}.big{font-size:28px;font-weight:800;color:var(--ac)}
.bd{display:inline-block;padding:2px 8px;border-radius:99px;font-size:13px;font-weight:700;color:#fff}
.w{background:#f08c00}.p{background:var(--ok)}.r{background:#1971c2}.c{background:#868e96}
.pic{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--bd);flex:none}label.b{display:inline-block;font-weight:600;font-size:14px;padding:8px 12px;border-radius:10px;background:var(--bd);cursor:pointer}
.full{width:100%;margin-top:8px}
#qrcode img{margin:0 auto;border-radius:8px}
.lang-btn{position:absolute;top:16px;right:16px;background:var(--card);border:1px solid var(--bd);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:bold;color:var(--tx);cursor:pointer}

/* 배달 어플 스타일 스텝 바 */
.stepper{display:flex;justify-content:space-between;margin:16px 0;position:relative}
.stepper::before{content:'';position:absolute;top:18px;left:15%;right:15%;height:4px;background:var(--bd);z-index:0}
.step-item{position:relative;z-index:1;text-align:center;flex:1}
.step-icon{width:36px;height:36px;border-radius:50%;background:var(--bd);color:var(--mu);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-weight:bold;font-size:14px}
.step-item.active .step-icon{background:var(--ac);color:#fff}
.step-item.active .step-text{color:var(--ac);font-weight:bold}
.step-text{font-size:12px;color:var(--mu)}
</style>
</head>
<body>
<button class="lang-btn" onclick="toggleLang()">🌐 <span id="l-txt">ENG</span></button>
<main>
  <div id="app"></div>
  <div style="text-align:center;margin:28px 0 8px">
    <span class="mu" id="sw" style="cursor:pointer;padding:14px" onclick="go(view==='order'||view==='done'?'staff':'order')">직원용</span>
  </div>
</main>

<script>
const CFG = {
  title: '○○학과 주점',
  bank: '카카오뱅크',
  account: '3333-00-0000000',
  holder: '홍길동',
  pin: '0000',
  tossId: '',
  menu: [
    { n: '떡볶이', p: 5000 },
    { n: '어묵탕', p: 6000 },
    { n: '치킨', p: 12000 },
    { n: '콜라', p: 2000 }
  ]
};

let lang = 'ko';
const T = {
  ko: {
    phTitle: '📱 휴대폰 번호 (필수)',
    phSub: '주문이 준비되면 문자를 보내드려요. 멀리 계셔도 괜찮아요!',
    tot: '합계', submit: '주문하고 송금 안내 받기', phErr: '위의 휴대폰 번호를 입력해 주세요',
    doneTitle: '💸 아래 정보로 입금해 주세요', ordNo: '주문번호', tossBtn: '📱 토스 앱으로 바로 송금하기',
    cpBtn: '📋 계좌번호 복사하기', cpDone: '복사됨 ✓', qrTitle: '토스 전용 QR', qrSub: '스캔 시 금액까지 자동 입력',
    autoRefresh: '입금이 확인되면 이 화면이 자동으로 바뀝니다', staffBtn: '직원용', newOrd: '새 주문',
    s1: '입금 대기', s2: '조리 중', s3: '준비 완료',
    msgCooking: '입금이 확인되어 맛있는 음식을 조리 중입니다!',
    msgReady: '🔔 주문하신 메뉴가 준비되었습니다! 부스에서 수령해 주세요.',
    wait: '입금대기', paid: '조리중', ready: '전달완료', cancel: '취소'
  },
  en: {
    phTitle: '📱 Phone Number (Required)', phSub: "We'll send a text when your order is ready!",
    tot: 'Total', submit: 'Order & Get Payment Info', phErr: 'Please enter your phone number above',
    doneTitle: '💸 Please Transfer Payment', ordNo: 'Order No.', tossBtn: '📱 Pay Directly via Toss App',
    cpBtn: '📋 Copy Account Number', cpDone: 'Copied ✓', qrTitle: 'Toss QR Code', qrSub: 'Scans with pre-filled amount',
    autoRefresh: 'This screen updates automatically after payment', staffBtn: 'Staff Only', newOrd: 'New Order',
    s1: 'Pending', s2: 'Cooking', s3: 'Ready',
    msgCooking: 'Payment confirmed! We are preparing your order.',
    msgReady: '🔔 Your order is ready! Please pick it up at the booth.',
    wait: 'Pending', paid: 'Cooking', ready: 'Ready', cancel: 'Canceled'
  }
};

CFG.menu.forEach((m, i) => m.id = i);
const $ = s => document.querySelector(s);
const W = n => n.toLocaleString('ko-KR') + '원';
let draft, photos = {}, orders = [], view = 'order', q = {}, myId = null, authed = false, phone = '';
let lastStatus = null;

function playAlertSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15); // A5
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
    if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
  } catch(e){}
}

function toggleLang() {
  lang = lang === 'ko' ? 'en' : 'ko';
  $('#l-txt').textContent = lang === 'ko' ? 'ENG' : '한';
  render();
}

function loadLocal() {
  try { loadCfg(JSON.parse(localStorage.getItem('fc') || 'null')); } catch (e) {}
  try { 
    const newOrders = JSON.parse(localStorage.getItem('fo') || '[]');
    if (myId) {
      const cur = newOrders.find(x => x.id === myId);
      if (cur && lastStatus && cur.s !== lastStatus) {
        if (cur.s === 'ready') playAlertSound();
        render();
      }
      if (cur) lastStatus = cur.s;
    }
    orders = newOrders;
  } catch (e) {}
  try { photos = JSON.parse(localStorage.getItem('fm') || '{}'); } catch (e) {}
}

function saveLocal() {
  try { localStorage.setItem('fo', JSON.stringify(orders)); } catch (e) {}
}

function addOrder(o) {
  o.id = 'l' + Date.now();
  orders.push(o);
  saveLocal();
  return o.id;
}

function patch(id, d) {
  const target = orders.find(x => x.id == id);
  if (target) { Object.assign(target, d); saveLocal(); render(); }
}

function go(v) {
  view = v;
  $('#sw').textContent = (v === 'staff' || v === 'settings') ? '← 주문 화면' : T[lang].staffBtn;
  render();
}

function render() {
  const a = $('#app');
  if (view === 'settings' && authed) a.innerHTML = setHTML();
  else if (view === 'staff' || view === 'settings') a.innerHTML = authed ? staffHTML() : pinHTML();
  else if (view === 'done') a.innerHTML = doneHTML();
  else orderHTML();
}

function orderHTML() {
  const t = T[lang];
  $('#app').innerHTML = `
    <h1>🍢 ${CFG.title}</h1>
    <div class="card" style="border:2px solid var(--ac)">
      <div style="font-weight:800;font-size:18px">${t.phTitle}</div>
      <div class="mu" style="margin:2px 0 8px">${t.phSub}</div>
      <input id="ph" inputmode="numeric" placeholder="010-0000-0000" style="font-size:22px" value="${phone}" oninput="fmt(this)">
    </div>
    <div class="card">
      ${CFG.menu.map(m => `
        <div class="row" style="padding:8px 0">
          <div style="display:flex;align-items:center;gap:12px">
            <img id="pic${m.id}" class="pic" hidden alt="">
            <div><b>${m.n}</b><div class="mu">${W(m.p)}</div></div>
          </div>
          <div class="q">
            <button class="g" onclick="bump(${m.id},-1)">−</button>
            <b id="q${m.id}">${q[m.id] || 0}</b>
            <button onclick="bump(${m.id},1)">+</button>
          </div>
        </div>
      `).join('')}
    </div>
    <div class="card row"><span>${t.tot}</span><span class="big" id="tot">0원</span></div>
    <div id="hint" class="mu" style="color:#e03131;text-align:center"></div>
    <button class="full" id="go" onclick="submit()" disabled>${t.submit}</button>
  `;
  sum(); pics();
}

function fmt(el) {
  const d = el.value.replace(/\D/g, '').slice(0, 11);
  phone = d;
  el.value = d.length > 7 ? `${d.slice(0, 3)}-${d.slice(3, d.length - 4)}-${d.slice(-4)}` : d.length > 3 ? `${d.slice(0, 3)}-${d.slice(3)}` : d;
  sum();
}
function bump(i, d) { q[i] = Math.max(0, (q[i] || 0) + d); $('#q' + i).textContent = q[i]; sum(); }
function cp(txt, btn) {
  const f = () => { const a = document.createElement('textarea'); a.value = txt; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) {} a.remove(); };
  try { navigator.clipboard.writeText(txt).catch(f); } catch (e) { f(); }
  const orig = btn.textContent; btn.textContent = T[lang].cpDone; setTimeout(() => btn.textContent = orig, 1500);
}
function pics() {
  CFG.menu.forEach(m => {
    const e = $('#pic' + m.id), u = photos['m' + m.id];
    if (e) { if (u) { e.src = u; e.hidden = false; } else e.hidden = true; }
  });
}
function pick(i, inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 400 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = im.width * k; c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      setPhoto(i, c.toDataURL('image/jpeg', .7));
    };
    im.src = r.result;
  };
  r.readAsDataURL(f);
}
function setPhoto(i, img) { photos['m' + i] = img; try { localStorage.setItem('fm', JSON.stringify(photos)); } catch (e) { alert('저장 공간이 부족해요'); } render(); }
const esc = txt => String(txt).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function loadCfg(d) { if (!d) return; ['bank', 'account', 'holder', 'tossId'].forEach(k => { if (d[k] !== undefined) CFG[k] = d[k]; }); if (d.title) CFG.title = d.title; if (Array.isArray(d.menu) && d.menu.length) CFG.menu = d.menu; }
function openSet() { draft = { bank: CFG.bank, account: CFG.account, holder: CFG.holder, tossId: CFG.tossId || '', title: CFG.title, menu: CFG.menu.map(m => ({ ...m })) }; go('settings'); }

function setHTML() {
  return `
    <h1>⚙ 설정 (Settings)</h1>
    <div class="card"><div class="mu">주점 이름</div><input value="${esc(draft.title)}" oninput="draft.title=this.value"></div>
    <div class="card">
      <div class="mu">입금 받을 계좌</div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:6px">
        <input value="${esc(draft.bank)}" placeholder="은행명" oninput="draft.bank=this.value">
        <input value="${esc(draft.account)}" inputmode="numeric" placeholder="계좌번호" oninput="draft.account=this.value">
        <input value="${esc(draft.holder)}" placeholder="예금주" oninput="draft.holder=this.value">
        <input value="${esc(draft.tossId)}" placeholder="토스 아이디 (선택)" oninput="draft.tossId=this.value">
      </div>
    </div>
    <div class="card">
      <div class="mu">메뉴 · 가격 · 사진</div>
      ${draft.menu.map((m, i) => `
        <div style="display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)">
          ${photos['m' + m.id] ? `<img class="pic" src="${photos['m' + m.id]}" alt="">` : '<div class="pic"></div>'}
          <div style="flex:1;display:flex;flex-direction:column;gap:6px;min-width:0">
            <input value="${esc(m.n)}" placeholder="메뉴 이름" oninput="draft.menu[${i}].n=this.value">
            <input type="number" inputmode="numeric" value="${m.p}" placeholder="가격" oninput="draft.menu[${i}].p=+this.value||0">
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <label class="b">${photos['m' + m.id] ? '변경' : '사진'}<input type="file" accept="image/*" hidden onchange="pick(${m.id},this)"></label>
            <button class="g" onclick="draft.menu.splice(${i},1);render()">삭제</button>
          </div>
        </div>
      `).join('')}
      <button class="g full" onclick="draft.menu.push({id:Date.now(),n:'',p:0});render()">+ 메뉴 추가</button>
    </div>
    <div id="err" class="mu" style="color:#e03131"></div>
    <button class="full ok" onclick="saveCfg()">저장</button>
    <button class="full g" onclick="go('staff')">취소</button>
  `;
}

function saveCfg() {
  const E = txt => { $('#err').textContent = txt; };
  const menu = draft.menu.filter(m => m.n.trim()).map(m => ({ id: m.id, n: m.n.trim(), p: m.p }));
  if (!menu.length) return E('메뉴가 하나 이상 필요해요');
  const ac = draft.account.trim();
  if (!/^[\d-]{8,20}$/.test(ac)) return E('계좌번호는 숫자와 -만 입력해 주세요');
  const d = { title: draft.title.trim() || CFG.title, menu, bank: draft.bank.trim() || CFG.bank, account: ac, holder: draft.holder.trim() || CFG.holder, tossId: draft.tossId.trim() };
  try { localStorage.setItem('fc', JSON.stringify(d)); } catch (e) {}
  loadCfg(d); go('staff');
}

const total = () => CFG.menu.reduce((s, m) => s + m.p * (q[m.id] || 0), 0);
function sum() {
  const ok = /^01\d{8,9}$/.test(phone);$('#tot').textContent = W(total());
  $('#go').disabled = !(total() > 0 && ok);
  $('#hint').textContent = total() > 0 && !ok ? T[lang].phErr : '';
}

function submit() {
  const items = CFG.menu.map(m => q[m.id] ? { n: m.n, c: q[m.id] } : null).filter(Boolean);
  const o = { phone, items, amount: total(), s: 'wait', t: Date.now(), no: String(Math.floor(Math.random() * 900) + 100) };
  $('#go').disabled = true;
  myId = addOrder(o);
  lastStatus = 'wait';
  q = {}; phone = ''; view = 'done'; render();
}

const me = () => orders.find(o => o.id === myId);

function doneHTML() {
  const o = me();
  if (!o) return '<div class="card">Loading…</div>';
  const t = T[lang];
  const acct = CFG.account.replace(/-/g, '');
  const toss = CFG.tossId ? `https://toss.me/${CFG.tossId}/${o.amount}` : `supertoss://send?bank=${encodeURIComponent(CFG.bank)}&accountNo=${acct}&amount=${o.amount}`;

  const step1 = o.s === 'wait' || o.s === 'paid' || o.s === 'ready' ? 'active' : '';
  const step2 = o.s === 'paid' || o.s === 'ready' ? 'active' : '';
  const step3 = o.s === 'ready' ? 'active' : '';

  const stepperHtml = `
    <div class="stepper">
      <div class="step-item ${step1}">
        <div class="step-icon">1</div>
        <div class="step-text">${t.s1}</div>
      </div>
      <div class="step-item ${step2}">
        <div class="step-icon">🍳</div>
        <div class="step-text">${t.s2}</div>
      </div>
      <div class="step-item ${step3}">
        <div class="step-icon">🔔</div>
        <div class="step-text">${t.s3}</div>
      </div>
    </div>
  `;

  if (o.s === 'paid' || o.s === 'ready') {
    return `
      <h1>${o.s === 'ready' ? t.s3 : t.s2}</h1>
      <div class="card" style="text-align:center">
        ${stepperHtml}
        <div class="big" style="font-size:22px;margin:12px 0">${o.s === 'ready' ? t.msgReady : t.msgCooking}</div>
        <div class="mu">${t.ordNo} <b style="font-size:18px;color:var(--tx)">#${o.no}</b></div>
        <div style="margin-top:8px;font-weight:600">${o.items.map(i => i.n + ' ×' + i.c).join(', ')}</div>
      </div>
      <button class="full g" onclick="view='order';render()">${t.newOrd}</button>
    `;
  }

  setTimeout(() => {
    const el = document.getElementById('qrcode');
    if (el) {
      el.innerHTML = '';
      new QRCode(el, { text: toss, width: 180, height: 180 });
    }
  }, 50);

  return `
    <h1>${t.doneTitle}</h1>
    <div class="card" style="text-align:center">
      ${stepperHtml}
      <div class="mu">${t.ordNo} <b>#${o.no}</b></div>
      <div class="big" style="margin:8px 0">${W(o.amount)}</div>
      
      <a href="${toss}" style="text-decoration:none">
        <button class="full toss" style="font-size:18px;padding:16px;margin-bottom:12px;font-weight:bold">${t.tossBtn}</button>
      </a>

      <div style="background:var(--bg);padding:16px;border-radius:12px;border:2px dashed var(--ac);margin:14px 0">
        <div style="font-size:15px;color:var(--mu);font-weight:600">${CFG.bank}</div>
        <div style="font-size:22px;font-weight:800;letter-spacing:1px;margin:4px 0;color:var(--tx)">${CFG.account}</div>
        <div style="font-size:16px;font-weight:700">Holder: ${CFG.holder}</div>
        <button class="full ok" style="margin-top:10px;font-size:18px" onclick="cp('${CFG.account}',this)">${t.cpBtn}</button>
      </div>

      <div style="display:flex;justify-content:center;margin-top:16px">
        <div>
          <div id="qrcode" style="background:#fff;padding:10px;border-radius:12px;width:200px;margin:0 auto"></div>
          <b style="display:block;margin-top:6px">${t.qrTitle}</b>
          <div class="mu">${t.qrSub}</div>
        </div>
      </div>
    </div>
    <button class="full g" onclick="view='order';render()">${t.newOrd}</button>
    <div class="mu" style="text-align:center;margin-top:6px">${t.autoRefresh}</div>
  `;
}

function pinHTML() {
  return `<div class="card"><div class="mu">직원 PIN</div><input id="pin" type="password" inputmode="numeric"><button class="full" onclick="if($('#pin').value===CFG.pin){authed=true;render()}else alert('PIN이 달라요')">입장</button></div>`;
}

function staffHTML() {
  const act = orders.filter(o => o.s !== 'cancel'), paid = act.filter(o => o.s !== 'wait'), cook = {};
  act.filter(o => o.s === 'paid').forEach(o => o.items.forEach(i => cook[i.n] = (cook[i.n] || 0) + i.c));
  const list = [...orders].sort((a, b) => (a.s === 'ready' || a.s === 'cancel') - (b.s === 'ready' || b.s === 'cancel') || a.t - b.t);
  return `
    <h1>📋 주문 현황</h1>
    <div class="mu">입금 계좌: ${esc(CFG.bank)} ${esc(CFG.account)} (${esc(CFG.holder)})</div>
    <div class="card row"><div>매출 <b>${W(paid.reduce((s, o) => s + o.amount, 0))}</b></div><div>입금대기 <b>${act.filter(o => o.s === 'wait').length}</b>건</div></div>
    <div class="card"><div class="mu">지금 만들 것 (입금완료분)</div>${Object.keys(cook).length ? Object.entries(cook).map(([k, v]) => `<b>${k} ×${v}</b>`).join(' · ') : '<span class="mu">없음</span>'}</div>
    ${list.map(o => {
      const msg = `[${CFG.title}]${o.no}번 주문이 준비됐어요! 부스로 와주세요.`;
      return `
        <div class="card">
          <div class="row"><b>#${o.no} ·${o.phone.replace(/(\d{3})(\d+)(\d{4})/, '$1-$2-$3')}</b><span class="bd w">${T.ko[o.s]}</span></div>
          <div>${o.items.map(i => i.n + ' ×' + i.c).join(', ')}</div>
          <div class="row"><b>${W(o.amount)}</b><span class="mu">${new Date(o.t).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}</span></div>
          <div class="row" style="margin-top:8px">
            ${o.s === 'wait' ? `<button class="ok" onclick="patch('${o.id}',{s:'paid'})">입금 확인 (조리 시작)</button><button class="g" onclick="patch('${o.id}',{s:'cancel'})">취소</button>` :
              o.s === 'paid' ? `<a href="sms:${o.phone}?&body=${encodeURIComponent(msg)}"><button class="g">📩 문자 호출</button></a><button class="g" data-t="${esc(msg)}" onclick="cp(this.dataset.t,this)">문구 복사</button><button onclick="patch('${o.id}',{s:'ready'})">🔔 메뉴 전달 완료</button>` : ''}
          </div>
        </div>
      `;
    }).join('') || '<div class="mu">아직 주문이 없어요</div>'}
    <button class="full g" onclick="openSet()">⚙️ 설정 (이름·메뉴·가격·사진)</button>
  `;
}

// 앱 실행 & 3초 주기 자동 동기화
loadLocal();
go('order');
setInterval(loadLocal, 3000);
</script>
</body>
</html>
